# decidra with the in-process native CUDA backend.
#
# The server process owns the GPU engine; no external model server, Python, or
# separate process is involved.
#
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose ps
#
# The d3-turbo package is mounted read-only; select the GPU with DECIDRA_GPU.

name: decidra

services:
  decidra:
    build:
      context: .
      dockerfile: Dockerfile
    image: decidra:0.2.0
    container_name: decidra
    restart: unless-stopped
    # The checkpoint files are usually mode 600. Match the host owner.
    user: "${DECIDRA_UID:-1000}:${DECIDRA_GID:-1000}"
    ports:
      - "${DECIDRA_SERVER_PORT:-8501}:8080"
    environment:
      DECIDRA_MODEL: ${DECIDRA_MODEL:-vllm-sr/d3-turbo}
      DECIDRA_TOKENIZER: /models/tokenizer.json
      DECIDRA_NATIVE_MODEL: /models
      DECIDRA_CHECKPOINT: /models
      DECIDRA_NATIVE_CACHE: "true"
      DECIDRA_NATIVE_MARLIN: ${DECIDRA_NATIVE_MARLIN:-true}
      DECIDRA_BIND_ADDR: 0.0.0.0:8080
      DECIDRA_METRICS_ENABLED: "true"
      DECIDRA_NATIVE_INT8: ${DECIDRA_NATIVE_INT8:-true}
      DECIDRA_NATIVE_INT8_GROUP_SCALE: ${DECIDRA_NATIVE_INT8_GROUP_SCALE:-true}
      DECIDRA_NATIVE_INT8_EXCLUDE: ${DECIDRA_NATIVE_INT8_EXCLUDE:-self_attn.v_proj,self_attn.k_proj}
      DECIDRA_NATIVE_GDN_CHUNKED: ${DECIDRA_NATIVE_GDN_CHUNKED:-true}
      DECIDRA_NATIVE_GDN_CHUNKED_MIN_SEQ: ${DECIDRA_NATIVE_GDN_CHUNKED_MIN_SEQ:-16}
      DECIDRA_NATIVE_GPU_EMBED: ${DECIDRA_NATIVE_GPU_EMBED:-false}
      DECIDRA_STATE_CACHE_ENTRIES: ${DECIDRA_STATE_CACHE_ENTRIES:-16}
      DECIDRA_STATE_CACHE_BYTES: ${DECIDRA_STATE_CACHE_BYTES:-5368709120}
      DECIDRA_STATE_CACHE_PIN: ${DECIDRA_STATE_CACHE_PIN:-1}
      DECIDRA_HOST_STATE_CACHE_BYTES: ${DECIDRA_HOST_STATE_CACHE_BYTES:-8589934592}
      DECIDRA_BATCH_REQUESTS: ${DECIDRA_BATCH_REQUESTS:-32}
      DECIDRA_BATCH_ROWS: ${DECIDRA_BATCH_ROWS:-32}
      DECIDRA_BATCH_WINDOW_US: ${DECIDRA_BATCH_WINDOW_US:-2000}
      DECIDRA_STATE_ONCE_MAX_ROWS: ${DECIDRA_STATE_ONCE_MAX_ROWS:-64}
    volumes:
      - ${DECIDRA_MODEL_DIR:-/srv/models/d3-turbo-w4a8-g64-v4}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DECIDRA_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
