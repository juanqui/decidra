# decidra with the in-process native CUDA backend.
#
# The server process owns the GPU engine; no external model server, Python, or
# separate process is involved.
#
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose ps
#
# GPU 0 is not used by this stack.

services:
  decidra:
    build:
      context: .
      dockerfile: Dockerfile
    image: decidra:0.1.0
    container_name: decidra
    restart: unless-stopped
    # The checkpoint files are usually mode 600. Match the host owner.
    user: "${DECIDRA_UID:-1000}:${DECIDRA_GID:-1000}"
    ports:
      - "${DECIDRA_SERVER_PORT:-8501}:8080"
    environment:
      DECIDRA_TOKENIZER: /models/awq-w4a16-v2/tokenizer.json
      DECIDRA_NATIVE_MODEL: /models/awq-w4a16-v2
      DECIDRA_CHECKPOINT: /models/awq-w4a16-v2
      DECIDRA_NATIVE_CACHE: "true"
      DECIDRA_NATIVE_MARLIN: ${DECIDRA_NATIVE_MARLIN:-true}
      # Fallback only: DECIDRA_NATIVE_MARLIN=false DECIDRA_NATIVE_FUSED_W4A16=true
      DECIDRA_NATIVE_FUSED_W4A16: ${DECIDRA_NATIVE_FUSED_W4A16:-false}
      DECIDRA_BIND_ADDR: 0.0.0.0:8080
      DECIDRA_METRICS_ENABLED: "true"
      # Set in the host environment or a .env file (never commit it).
      DECIDRA_SIGNING_KEY: ${DECIDRA_SIGNING_KEY:-}
    volumes:
      # Read-only: packed weights, tokenizer, decision_head/, and calibration.json.
      - ${DECIDRA_MODELS_DIR:-/srv/models/jev-awq}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
