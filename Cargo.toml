[package]
name = "jev-engine"
version = "0.1.0"
edition = "2024"
description = "JEV decision API server backed by the native CUDA engine (AWQ W4A16 on one RTX 4090)"
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.85"

[workspace]
members = ["native"]
resolver = "3"

[features]
default = []
# Links the in-process `jev-native` CUDA engine. Off by default so `cargo test`
# builds the API against `MockBackend` without a CUDA toolchain.
native = ["dep:jev-native"]

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
crc32fast = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
jev-native = { path = "native", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokenizers = "0.21"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
