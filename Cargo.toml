[package]
name = "decidra"
version = "0.2.0"
edition = "2024"
description = "Decidra: state-once inference engine for vllm-sr/d3-turbo (native CUDA)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/juanqui/decidra"
rust-version = "1.85"

[workspace]
members = ["native"]
resolver = "3"

[features]
default = []
# Links the in-process `decidra-native` CUDA engine. Off by default so `cargo test`
# builds the API without a CUDA toolchain.
native = ["dep:decidra-native"]

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
decidra-native = { path = "native", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokenizers = "0.21"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
blake3 = "1"
half = "2"
fast_image_resize = "6.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
